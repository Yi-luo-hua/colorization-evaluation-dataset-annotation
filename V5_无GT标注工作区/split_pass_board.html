<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V5 全量上色图标注看板</title>
<style>
/* PROJECT_DASHBOARD_STYLES */
main{max-width:1160px;padding:28px 24px}
.masthead{align-items:flex-start}
.masthead-note{white-space:nowrap}
h1{font-size:26px}
h2{font-size:16px;margin:0 0 12px}
#total{font-size:48px}
#completed{font-size:35px;font-weight:650}
#summary,.subheading{color:var(--muted);margin:8px 0}
#status{font-weight:600}
.sections{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.overview{padding:20px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
table .number{text-align:right}
meter{display:block;width:100%;height:8px;appearance:none;margin-top:8px}
meter::-webkit-meter-bar{background:#edf1f6;border:0}
meter::-webkit-meter-optimum-value{background:var(--blue)}
#activity td:last-child{overflow-wrap:anywhere}
#activity-panel{overflow:auto}
@media(max-width:660px){
  main{padding:18px 12px}
  .masthead{flex-direction:column;gap:8px}
  .masthead-note{text-align:left}
  .sections{grid-template-columns:1fr}
  .metrics-grid{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:12px}
}
</style>
</head>
<body>
<main>
  <header class="masthead">
    <div>
      <h1>V5 全量上色图标注看板</h1>
      <p id="summary">正在读取全量队列</p>
    </div>
    <div class="masthead-note" id="status" role="status">连接中</div>
  </header>

  <section class="overview" aria-label="全量进度">
    <div class="hero-grid">
      <div>
        <div class="hero-number" id="total">—</div>
        <p class="subheading">全部上色图</p>
      </div>
      <div>
        <div id="completed">—</div>
        <p class="subheading">已通过终审</p>
      </div>
    </div>
    <meter id="overall" value="0" max="1" aria-label="终审完成进度"></meter>
    <div class="metrics-grid" id="metrics"></div>
  </section>

  <div class="sections">
    <section class="side-section">
      <h2>分轮验收</h2>
      <table>
        <thead><tr><th>阶段</th><th class="number">已验收图数</th></tr></thead>
        <tbody id="stages"></tbody>
      </table>
    </section>
    <section class="side-section">
      <h2>数据范围</h2>
      <table>
        <thead><tr><th>划分</th><th>模型</th><th class="number">总数</th><th class="number">终审完成</th></tr></thead>
        <tbody id="scopes"></tbody>
      </table>
    </section>
  </div>

  <section class="side-section" id="activity-panel">
    <h2>正在处理和待续接的批次</h2>
    <p id="idle" class="subheading">尚无正在处理的批次</p>
    <table id="activity-table" hidden>
      <thead><tr><th>批次</th><th>当前阶段</th><th>状态</th><th>最近反馈</th></tr></thead>
      <tbody id="activity"></tbody>
    </table>
  </section>
</main>
<script>
const el = id => document.getElementById(id);
const fmt = number => Number(number).toLocaleString('zh-CN');
const labels = {
  '01_initial': '第一轮 · D / A / B',
  '02_color_and_distribution': '第二轮 · C / E1 / E2 / F',
  '03a_independent_review': '第三轮 · 七类独立检查',
  '03b_finalize_review': '第三轮 · 对照终标'
};
const activityState = {running: '运行中', retry_wait: '等待补试', quota_wait: '额度暂停', paused: '待续接', needs_review: '待处理'};

function tableRows(id, rows, numericColumns) {
  const items = rows.map(values => {
    const tr = document.createElement('tr');
    values.forEach((value, index) => {
      const td = tr.insertCell();
      td.textContent = value;
      if (numericColumns.includes(index)) td.className = 'number';
    });
    return tr;
  });
  el(id).replaceChildren(...items);
}

function show(data) {
  const counts = data.counts;
  const images = state => counts[state]?.images ?? 0;
  const completed = images('completed');
  el('summary').textContent = data.model + ' · 每包 ' + data.batch_size + ' 张 · 最多 ' + data.worker_limit + ' 路';
  el('total').textContent = fmt(data.total);
  el('completed').textContent = fmt(completed);
  el('status').textContent = completed === data.total ? '全部完成'
    : images('running') ? '正在标注' : images('paused') ? '有待续接任务'
    : completed ? '等待继续' : '待启动';
  el('overall').max = data.total;
  el('overall').value = completed;

  el('metrics').replaceChildren(...[
    ['待领取', images('queued')], ['处理中', images('running')],
    ['待续接', images('paused')], ['首批已备包', data.starter_images]
  ].map(([label, count]) => {
    const metric = document.createElement('div');
    metric.className = 'metric';
    const name = document.createElement('div');
    name.className = 'metric-label';
    name.textContent = label;
    const value = document.createElement('div');
    value.className = 'metric-number';
    value.textContent = fmt(count);
    metric.append(name, value);
    return metric;
  }));

  tableRows('stages', Object.entries(labels).map(([key, label]) => [label, fmt(data.stages[key])]), [1]);
  tableRows('scopes', data.scopes.map(([split, model, count, done]) => [
    ({train: 'Train', val: 'Val', test: 'Test'})[split], model === 'lcad' ? 'LCAD' : 'UniColor', fmt(count), fmt(done)
  ]), [2,3]);
  el('idle').hidden = data.active.length > 0;
  el('activity-table').hidden = data.active.length === 0;
  tableRows('activity', data.active.map(job => [job.batch, labels[job.stage] || '—',
    job.state === 'running' && !job.live ? '等待执行器更新' : (activityState[job.state] || job.state),
    job.problem || '—']), []);
}

async function refresh() {
  try {
    const response = await fetch('/api/status', {cache:'no-store'});
    if (!response.ok) throw new Error('无法读取');
    show(await response.json());
  } catch {
    el('status').textContent = '读取队列失败';
  }
}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
